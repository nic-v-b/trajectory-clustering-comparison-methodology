name: Extract published paper figure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'add-paper-figure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download published paper and extract Figure 1
        run: |
          python -m pip install --quiet pymupdf requests beautifulsoup4
          python - <<'PY'
          import fitz
          import requests
          from bs4 import BeautifulSoup
          from pathlib import Path

          doi_url = "https://doi.org/10.59400/cai4416"
          headers = {"User-Agent": "Mozilla/5.0"}
          landing = requests.get(doi_url, headers=headers, timeout=60)
          landing.raise_for_status()
          print("Resolved DOI landing page:", landing.url)

          soup = BeautifulSoup(landing.text, "html.parser")
          pdf_url = None

          meta = soup.find("meta", attrs={"name": "citation_pdf_url"})
          if meta and meta.get("content"):
              pdf_url = meta["content"]

          if not pdf_url:
              for tag in soup.find_all("a", href=True):
                  href = tag["href"]
                  text = tag.get_text(" ", strip=True).lower()
                  if "pdf" in text or "/article/download/" in href.lower() or href.lower().endswith(".pdf"):
                      pdf_url = requests.compat.urljoin(landing.url, href)
                      break

          if not pdf_url:
              raise RuntimeError("Could not locate the publisher PDF URL from the DOI landing page.")

          print("Published PDF URL:", pdf_url)
          pdf_response = requests.get(pdf_url, headers=headers, timeout=120)
          pdf_response.raise_for_status()
          if not pdf_response.content.startswith(b"%PDF"):
              raise RuntimeError(
                  f"Publisher PDF URL did not return a PDF: {pdf_response.headers.get('content-type')}"
              )

          paper_path = Path("/tmp/paper.pdf")
          paper_path.write_bytes(pdf_response.content)

          out_path = Path("docs/figures/clustering_methodology_overview.png")
          out_path.parent.mkdir(parents=True, exist_ok=True)

          doc = fitz.open(paper_path)
          target = "Methodology overview"
          for page_number, page in enumerate(doc):
              hits = page.search_for(target)
              if not hits:
                  continue

              caption = hits[0]
              # Figure 1 is immediately above the caption in the published paper.
              clip = fitz.Rect(
                  30,
                  max(0, caption.y0 - 165),
                  page.rect.width - 30,
                  max(0, caption.y0 - 5),
              )
              pix = page.get_pixmap(matrix=fitz.Matrix(3, 3), clip=clip, alpha=False)
              pix.save(out_path)
              print(f"Extracted Figure 1 from PDF page {page_number + 1}: {out_path}")
              print(f"Crop points: {clip}")
              print(f"Output pixels: {pix.width}x{pix.height}")
              break
          else:
              raise RuntimeError("Could not locate Figure 1 caption in the published PDF.")
          PY
      - name: Commit extracted figure to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures/clustering_methodology_overview.png
          if ! git diff --cached --quiet; then
            git commit -m "Add published methodology figure [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
